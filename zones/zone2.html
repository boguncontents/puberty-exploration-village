<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사춘기 탐험마을 | 2구역 비밀기록 서고</title>
<style>
  html,body{width:100%;height:100%;margin:0;overflow:hidden;}
  body{background:#142231;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;}
  #zone2-frame{
    position:fixed;top:50%;left:50%;width:1440px;height:960px;
    border:0;background:#503021;display:block;
    transform-origin:center center;
  }
</style>
</head>
<body>
<iframe id="zone2-frame" title="비밀기록 서고 미션 1과 미션 2" loading="eager" allowfullscreen></iframe>
<script>
(function(){
  // Match the reference 3:2 game view used by the other three zones.
  // The original approved scene keeps its own 1440x960 viewport, so all
  // illustration, text, popup and touch target coordinates scale together.
  const frame=document.getElementById('zone2-frame');
  const BASE_WIDTH=1440;
  const BASE_HEIGHT=960;
  function fit(){
    // Use the visible browser area, including when the address bar is expanded.
    const viewport=window.visualViewport;
    const width=Math.max(1,viewport?.width||document.documentElement.clientWidth||window.innerWidth);
    const height=Math.max(1,viewport?.height||document.documentElement.clientHeight||window.innerHeight);
    const offsetX=viewport?.offsetLeft||0;
    const offsetY=viewport?.offsetTop||0;
    const scale=Math.min(width/BASE_WIDTH,height/BASE_HEIGHT);
    frame.style.left=(offsetX+width/2)+'px';
    frame.style.top=(offsetY+height/2)+'px';
    frame.style.transform='translate(-50%, -50%) scale('+scale+')';
  }
  const params=location.search||'';
  frame.src='zone2_game.html'+params;
  window.addEventListener('resize',fit,{passive:true});
  window.addEventListener('orientationchange',fit,{passive:true});
  if(window.visualViewport) window.visualViewport.addEventListener('resize',fit,{passive:true});
  if(window.visualViewport) window.visualViewport.addEventListener('scroll',fit,{passive:true});
  fit();
})();
</script>
</body>
</html>
