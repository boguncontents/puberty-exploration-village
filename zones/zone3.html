function render(){const p=CLIENTS[index];$('person').src=IMG[p.who+'_bust'];$('dialog').innerHTML=`<strong>${index+1}번째 손님 · ${p.intro}</strong><br>${p.desc}<br><br><b>필요한 물품을 2개 골라주세요!</b>`;$('progress').textContent=`${index} / 4명 완료`;$('feedback').textContent='';draw()}
function draw(){const div=$('items');div.replaceChildren();for (const [id,label] of PRODUCTS){let b=document.createElement('button');b.className='item'+(chosen.includes(id)?' selected':'');b.innerHTML=`<img alt="" src="${IMG[id]}"><span>${label}</span>`;b.setAttribute('aria-pressed',chosen.includes(id));b.onclick=()=>{if(chosen.includes(id)){chosen=chosen.filter(x=>x!==id);$('feedback').textContent='';draw();return}if(!CLIENTS[index].right.includes(id)){const msg=`띠! ‘${label}’은 이번 손님에게 필요한 물품이 아니에요. 다시 골라주세요.`;$('feedback').textContent=msg;b.classList.add('mistake');setTimeout(()=>b.classList.remove('mistake'),780);return}if(chosen.length<2){chosen.push(id);$('feedback').textContent='';draw()}};div.appendChild(b)}$('counter').textContent=`(${chosen.length}/2)`;$('check').disabled=chosen.length!==2;const slots=$('slots');slots.replaceChildren();for(let i=0;i<2;i++){const box=document.createElement('div');box.className='slot';if(chosen[i]){const id=chosen[i];box.innerHTML=`<img alt="${PRODUCTS.find(v=>v[0]===id)[1]}" src="${IMG[id]}"><button aria-label="${id} 제거">✕</button>`;box.querySelector('button').onclick=()=>{chosen=chosen.filter(x=>x!==id);draw()}}else box.textContent='+';slots.appendChild(box)}}
$('check').onclick=()=>{const p=CLIENTS[index];if(p.right.length===chosen.length&&p.right.every(v=>chosen.includes(v))){showShopDeliverySuccess(p.comment,index<3?'다음 손님 만나기':'초록색 열쇠 받기',()=>{if(index<3){index++;chosen=[];render();$('game').className='game stage-play'}else reward()})}else{$('feedback').textContent='다시 생각해 볼까요? 두 물품을 바꿔 골라보세요.'}};
function reward(){$('overlay').classList.add('hide');$('game').className='game stage-play';$('zone3Reward').classList.add('show');$('rewardNext').onclick=()=>{ $('zone3Reward').classList.remove('show');};}

<script id="tablet-common-frame-js">(function(){
const BASE_W=1440,BASE_H=960;
function install(){
 if(document.getElementById('tablet-screen-host'))return;
 const host=document.createElement('div');host.id='tablet-screen-host';
 const virtual=document.createElement('div');virtual.id='tablet-virtual-screen';
 const movable=[...document.body.children].filter(el=>!['SCRIPT','STYLE'].includes(el.tagName));
 for(const el of movable)virtual.appendChild(el);
 host.appendChild(virtual);document.body.insertBefore(host,document.body.firstChild);
 const fit=()=>{
   const w=document.documentElement.clientWidth||window.innerWidth;
   const h=window.visualViewport?.height||window.innerHeight;
   const scale=Math.min(w/BASE_W,h/BASE_H);
   virtual.style.transform=`scale(${scale})`;
   virtual.style.marginRight=`${(scale-1)*BASE_W}px`;
   virtual.style.marginBottom=`${(scale-1)*BASE_H}px`;
 };
 fit();window.addEventListener('resize',fit,{passive:true});
 if(window.visualViewport)window.visualViewport.addEventListener('resize',fit,{passive:true});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});else install();
})();</script>
